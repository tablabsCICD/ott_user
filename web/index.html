<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Discover and stream movies, series, mini-series and other video entertainment with Filmytell OTT.">
  <link rel="canonical" href="https://filmytell.com/">
  <meta property="og:title" content="Filmytell OTT">
  <meta property="og:description" content="Discover and stream digital entertainment across supported devices with Filmytell.">
  <meta property="og:site_name" content="Filmytell">
  <meta property="og:url" content="https://filmytell.com/">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Filmytell">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Filmytell — Movies, Series and Mini-Series</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    (function () {
      // Keep disabled for the public website. Set to true only if automatic
      // Android app launching is intentionally restored in the future.
      const ENABLE_AUTO_APP_REDIRECT = false;

      if (!ENABLE_AUTO_APP_REDIRECT) {
        return;
      }

      var supportedPath = /^\/(gift|movie|series|short)(\/|$)/i.test(
        window.location.pathname
      );
      var isAndroid = /Android/i.test(window.navigator.userAgent || "");

      if (!isAndroid || !supportedPath) {
        return;
      }

      var packageName = "com.filmytell.ott";
      var playStoreUrl = "https://play.google.com/store/apps/details?id=" +
          packageName;
      var intentPath = window.location.host +
          window.location.pathname +
          window.location.search +
          window.location.hash;

      window.location.href = "intent://" + intentPath +
          "#Intent;scheme=https;package=" + packageName +
          ";S.browser_fallback_url=" + encodeURIComponent(playStoreUrl) +
          ";end";
    })();

    window.openRazorpayCheckout = function (options) {
      return new Promise(function (resolve) {
        if (typeof Razorpay === "undefined") {
          resolve({
            success: false,
            message: "Razorpay checkout failed to load in the browser."
          });
          return;
        }

        var settled = false;
        var existingModal = options.modal || {};

        var razorpay = new Razorpay(Object.assign({}, options, {
          handler: function (response) {
            if (settled) return;
            settled = true;
            resolve({
              success: true,
              orderId: response.razorpay_order_id,
              paymentId: response.razorpay_payment_id,
              signature: response.razorpay_signature
            });
          },
          modal: Object.assign({}, existingModal, {
            ondismiss: function () {
              if (settled) return;
              settled = true;
              resolve({
                success: false,
                message: "Payment cancelled or closed by user."
              });
            }
          })
        }));

        razorpay.on("payment.failed", function (response) {
          if (settled) return;
          settled = true;

          var error = (response && response.error) || {};
          var metadata = error.metadata || {};

          resolve({
            success: false,
            message: error.description || "Payment cancelled or failed.",
            errorCode: error.code || null,
            orderId: metadata.order_id || null,
            paymentId: metadata.payment_id || null
          });
        });

        try {
          razorpay.open();
        } catch (error) {
          if (settled) return;
          settled = true;
          resolve({
            success: false,
            message: error && error.message
                ? error.message
                : "Unable to open Razorpay checkout."
          });
        }
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
