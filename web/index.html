<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Discover and stream movies, series, mini-series and other video entertainment with Filmytell OTT.">
  <link rel="canonical" href="https://filmytell.com/">
  <meta property="og:title" content="Filmytell OTT">
  <meta property="og:description" content="Discover and stream digital entertainment across supported devices with Filmytell.">
  <meta property="og:site_name" content="Filmytell">
  <meta property="og:url" content="https://filmytell.com/">
  <meta property="og:type" content="website">

  <!-- Apple Smart App Banner for iOS Safari -->
  <meta name="apple-itunes-app" content="app-id=6783863260">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Filmytell">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Filmytell — Movies, Series and Mini-Series</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    (function () {
      try {
        var pathname = window.location.pathname || "";
        var search = window.location.search || "";
        var hash = window.location.hash || "";

        var isRegisterPath = /^\/register(\/|$)/i.test(pathname) ||
          /^\/#\/register(\/|$)/i.test(hash) ||
          /[?&](referralCode|referral_code|ref|code)=/i.test(search) ||
          /[?&](referralCode|referral_code|ref|code)=/i.test(hash);

        var contentMatch = pathname.match(/^\/(?:ott\/)?(?:share\/)?(movie|series|miniseries|mini-series|short-film|shortfilm|short|shorts)\/(\d+)/i) ||
          hash.match(/^\/#\/(?:share\/)?(movie|series|miniseries|mini-series|short-film|shortfilm|short|shorts)\/(\d+)/i);

        var searchParams = new URLSearchParams(search);
        if (!searchParams.has("referralCode") && hash.indexOf("?") !== -1) {
          searchParams = new URLSearchParams(hash.substring(hash.indexOf("?")));
        }

        var referralCode = searchParams.get("referralCode") ||
          searchParams.get("referral_code") ||
          searchParams.get("ref") ||
          searchParams.get("code") ||
          "";
        referralCode = referralCode.trim();

        var preferWeb = searchParams.get("web") === "true" ||
          searchParams.get("continue") === "web" ||
          searchParams.get("mode") === "web";

        var ua = window.navigator.userAgent || "";
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
          (window.navigator.platform === "MacIntel" && window.navigator.maxTouchPoints > 1);

        var packageName = "com.filmytell.ott";
        var playStoreBase = "https://play.google.com/store/apps/details?id=" + packageName;
        var appStoreUrl = "https://apps.apple.com/fr/app/filmytell/id6783863260";

        if (isRegisterPath && !preferWeb) {
          if (isAndroid) {
            var targetPlayStoreUrl = playStoreBase;
            if (referralCode.length >= 2) {
              var referrerPayload = "referralCode=" + encodeURIComponent(referralCode);
              targetPlayStoreUrl += "&referrer=" + encodeURIComponent(referrerPayload);
            }
            window.location.replace(targetPlayStoreUrl);
            return;
          }

          if (isIOS) {
            if (!referralCode) {
              window.location.replace(appStoreUrl);
              return;
            }
            // Safari requires a user gesture. Never redirect before copying finishes.
            var panel = document.createElement("section");
            panel.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:radial-gradient(circle at 50% 20%, #1e1014 0%, #0a0a0c 100%);color:white;padding:32px 20px;overflow:auto;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-sizing:border-box";
            var heading = document.createElement("h1");
            heading.textContent = "Install Filmytell with your referral";
            heading.style.cssText = "font-size:24px;font-weight:700;margin:0 0 12px 0;color:#ffffff";
            var message = document.createElement("p");
            message.textContent = "Copy your referral link, then install Filmytell. Allow Paste when you first open the app. Avoid copying anything else until then.";
            message.style.cssText = "color:rgba(255,255,255,0.8);line-height:1.5;max-width:360px;margin:0 0 20px 0";
            var button = document.createElement("button");
            button.textContent = "Copy referral & install";
            button.style.cssText = "padding:16px 28px;font:inherit;font-weight:600;font-size:16px;border-radius:14px;border:0;background:linear-gradient(135deg, #e53741 0%, #b81d24 100%);color:white;cursor:pointer;box-shadow:0 4px 16px rgba(229,55,65,0.4);width:100%;max-width:320px";
            var status = document.createElement("p");
            status.setAttribute("role", "status");
            status.style.cssText = "color:#ff8585;font-size:14px;margin:12px 0;min-height:20px;max-width:320px";
            var link = "https://filmytell.com/register?referralCode=" + encodeURIComponent(referralCode);
            button.onclick = async function () {
              button.disabled = true;
              try {
                if (window.navigator.clipboard && window.navigator.clipboard.writeText) {
                  await window.navigator.clipboard.writeText(link);
                }
                window.location.assign(appStoreUrl);
              } catch (_) {
                status.textContent = "Could not copy. Please allow clipboard access and try again. You can also install, then reopen your original referral link.";
              } finally {
                button.disabled = false;
              }
            };
            var install = document.createElement("a");
            install.href = appStoreUrl;
            install.textContent = "Install without copying referral";
            install.style.cssText = "color:rgba(255,255,255,0.6);font-size:14px;text-decoration:underline;margin-top:8px";
            panel.append(heading, message, button, status, install);
            document.body.appendChild(panel);
            return;
          }
        }

        // On mobile for content links, if autoRedirect is requested or app not installed
        if (contentMatch && !preferWeb) {
          var contentType = contentMatch[1].toLowerCase();
          var contentId = contentMatch[2];
          var contentReferrer = "content_type=" + encodeURIComponent(contentType) + "&content_id=" + encodeURIComponent(contentId);
          if (referralCode.length >= 2) {
            contentReferrer += "&referralCode=" + encodeURIComponent(referralCode);
          }

          // If iOS, copy deep link to clipboard for instant detection upon app install
          if (isIOS && window.navigator.clipboard && window.navigator.clipboard.writeText) {
            window.navigator.clipboard.writeText(window.location.href).catch(function () {});
          }
        }
      } catch (e) {
        // Fallback gracefully to normal web app execution
      }
    })();

    window.openRazorpayCheckout = function (options) {
      return new Promise(function (resolve) {
        if (typeof Razorpay === "undefined") {
          resolve({
            success: false,
            message: "Razorpay checkout failed to load in the browser."
          });
          return;
        }

        var settled = false;
        var existingModal = options.modal || {};

        var razorpay = new Razorpay(Object.assign({}, options, {
          handler: function (response) {
            if (settled) return;
            settled = true;
            resolve({
              success: true,
              orderId: response.razorpay_order_id,
              paymentId: response.razorpay_payment_id,
              signature: response.razorpay_signature
            });
          },
          modal: Object.assign({}, existingModal, {
            ondismiss: function () {
              if (settled) return;
              settled = true;
              resolve({
                success: false,
                message: "Payment cancelled or closed by user."
              });
            }
          })
        }));

        razorpay.on("payment.failed", function (response) {
          if (settled) return;
          settled = true;

          var error = (response && response.error) || {};
          var metadata = error.metadata || {};

          resolve({
            success: false,
            message: error.description || "Payment cancelled or failed.",
            errorCode: error.code || null,
            orderId: metadata.order_id || null,
            paymentId: metadata.payment_id || null
          });
        });

        try {
          razorpay.open();
        } catch (error) {
          if (settled) return;
          settled = true;
          resolve({
            success: false,
            message: error && error.message
                ? error.message
                : "Unable to open Razorpay checkout."
          });
        }
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
