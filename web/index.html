<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ott">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ott</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpayCheckout = function (options) {
      return new Promise(function (resolve) {
        if (typeof Razorpay === "undefined") {
          resolve({
            success: false,
            message: "Razorpay checkout failed to load in the browser."
          });
          return;
        }

        var settled = false;
        var existingModal = options.modal || {};

        var razorpay = new Razorpay(Object.assign({}, options, {
          handler: function (response) {
            if (settled) return;
            settled = true;
            resolve({
              success: true,
              orderId: response.razorpay_order_id,
              paymentId: response.razorpay_payment_id,
              signature: response.razorpay_signature
            });
          },
          modal: Object.assign({}, existingModal, {
            ondismiss: function () {
              if (settled) return;
              settled = true;
              resolve({
                success: false,
                message: "Payment cancelled or closed by user."
              });
            }
          })
        }));

        razorpay.on("payment.failed", function (response) {
          if (settled) return;
          settled = true;

          var error = (response && response.error) || {};
          var metadata = error.metadata || {};

          resolve({
            success: false,
            message: error.description || "Payment cancelled or failed.",
            errorCode: error.code || null,
            orderId: metadata.order_id || null,
            paymentId: metadata.payment_id || null
          });
        });

        try {
          razorpay.open();
        } catch (error) {
          if (settled) return;
          settled = true;
          resolve({
            success: false,
            message: error && error.message
                ? error.message
                : "Unable to open Razorpay checkout."
          });
        }
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
