<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact Us | Filmytell</title>
  <meta name="description" content="Get in touch with Filmytell for support, business queries, and partner enquiries.">
  <link rel="canonical" href="https://filmytell.com/contact.html">
  <meta property="og:title" content="Contact Us | Filmytell">
  <meta property="og:description"
    content="Reach out to the Filmytell team for account, playback, and business support.">
  <meta property="og:url" content="https://filmytell.com/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Filmytell">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/static-pages.css">
  <style>
    .contact-container {
      max-width: 760px;
      margin: 0 auto;
    }
    .enquiry-card {
      background: linear-gradient(145deg, #151515, #0d0d0d);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }
    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .enquiry-card {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="/"><img src="/icons/Icon-192.png" alt="Filmytell"></a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about-us.html">About Us</a>
        <a href="/help-center.html">Help Center</a>
        <a href="/contact.html">Contact Us</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="hero" style="text-align: center; padding: 40px 0 20px;">
      <h1>Contact Us</h1>
      <p class="lead" style="margin: 0 auto;">Send us your enquiry and our team will get back to you.</p>
    </section>
    <section class="content contact-container">
      <article class="enquiry-card">
        <form id="contactForm" onsubmit="handleContactSubmit(event)">
          <div class="form-row">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="name">Your Name</label>
              <input type="text" id="name" class="form-input" placeholder="Enter your full name" required>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="email">Email Address</label>
              <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" class="form-input" placeholder="+91 98765 43210">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="subject">Subject</label>
              <input type="text" id="subject" class="form-input" placeholder="How can we help you?" required>
            </div>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" class="form-textarea" placeholder="Provide details about your query..." rows="5"
              required></textarea>
          </div>
          <div style="text-align: right; margin-top: 24px;">
            <button type="submit" class="contact-btn" style="width: 100%; max-width: 220px; padding: 14px 28px;">Send Message</button>
          </div>
          <p id="formStatus" style="margin-top: 16px; font-weight: 600; text-align: center; display: none;"></p>
        </form>
      </article>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="/about-us.html">About Us</a>
        <a href="/contact.html">Contact Us</a>
        <a href="/help-center.html">Help Center</a>
        <a href="/privacy-policy.html">Privacy Policy</a>
        <a href="/terms-of-service.html">Terms of Service</a>
        <a href="/cookies.html">Cookies</a>
        <a href="mailto:connect@filmytell.com">connect@filmytell.com</a>
      </div>
      <p class="copyright">© 2026 Filmytell. All rights reserved.</p>
    </div>
  </footer>
  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      var name = document.getElementById('name').value.trim();
      var email = document.getElementById('email').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var subject = document.getElementById('subject').value.trim();
      var message = document.getElementById('message').value.trim();
      var status = document.getElementById('formStatus');

      var bodyText = 'Name: ' + name + '\nEmail: ' + email + (phone ? '\nPhone: ' + phone : '') + '\n\nMessage:\n' + message;
      var mailtoUrl = 'mailto:connect@filmytell.com' +
        '?subject=' + encodeURIComponent(subject || 'Enquiry from ' + name) +
        '&body=' + encodeURIComponent(bodyText);

      window.location.href = mailtoUrl;

      if (status) {
        status.style.display = 'block';
        status.style.color = '#4ade80';
        status.textContent = 'Opening your email client... You can also email connect@filmytell.com directly.';
      }
    }
  </script>
</body>

</html>
