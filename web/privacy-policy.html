<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Privacy Policy | Filmytell</title>
  <meta name="description" content="Read the Filmytell Privacy Policy and learn how information is handled.">
  <link rel="canonical" href="https://filmytell.com/privacy-policy.html">
  <meta property="og:title" content="Privacy Policy | Filmytell">
  <meta property="og:description" content="How Filmytell handles account, device, viewing and service information.">
  <meta property="og:url" content="https://filmytell.com/privacy-policy.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Filmytell">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/static-pages.css">
</head>

<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="/"><img src="/icons/Icon-192.png" alt="Filmytell"></a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about-us.html">About Us</a>
        <a href="/help-center.html">Help Center</a>
        <a href="/contact.html">Contact Us</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="hero legal-hero">

      <h1>Privacy Policy</h1>
      <p class="lead">Please review our latest official Privacy Policy below.</p>
    </section>
    <section class="content full-screen-legal">
      <div id="documentContainer">
        <div class="legal-status-box">
          <div class="spinner" role="status" aria-label="Loading"></div>
          <p>Loading document...</p>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="/about-us.html">About Us</a>
        <a href="/contact.html">Contact Us</a>
        <a href="/help-center.html">Help Center</a>
        <a href="/privacy-policy.html">Privacy Policy</a>
        <a href="/terms-of-service.html">Terms of Service</a>
        <a href="/cookies.html">Cookies</a>
        <a href="mailto:connect@filmytell.com">connect@filmytell.com</a>
      </div>
      <p class="copyright">© 2026 Filmytell. All rights reserved.</p>
    </div>
  </footer>
  <script>
    (function () {
      var docType = 'privacy';
      var container = document.getElementById('documentContainer');

      function renderStatus(message, showRetry) {
        if (!container) return;
        var html = '<div class="legal-status-box"><p>' + message + '</p>';
        if (showRetry) {
          html += '<button type="button" class="button" id="retryBtn">Try Again</button>';
        }
        html += '</div>';
        container.innerHTML = html;
        if (showRetry) {
          var btn = document.getElementById('retryBtn');
          if (btn) btn.addEventListener('click', loadDocument);
        }
      }

      function renderLoading() {
        if (!container) return;
        container.innerHTML = '<div class="legal-status-box">' +
          '<div class="spinner" role="status" aria-label="Loading"></div>' +
          '<p>Loading document...</p>' +
          '</div>';
      }

      function extractDocumentUrl(data, type) {
        if (!data) return null;
        if (Array.isArray(data)) {
          for (var i = 0; i < data.length; i++) {
            var item = data[i];
            if (!item) continue;
            var tag = String(item.documentType || item.type || item.slug || item.key || item.name || item.title || '').toLowerCase();
            if (type === 'privacy' && (tag.indexOf('privacy') !== -1 || tag.indexOf('privacy-policy') !== -1)) {
              return item.documentUrl || item.url || item.pdfUrl || item.fileUrl || null;
            }
            if (type === 'terms' && (tag.indexOf('term') !== -1 || tag.indexOf('terms-of-use') !== -1 || tag.indexOf('terms-and-conditions') !== -1)) {
              return item.documentUrl || item.url || item.pdfUrl || item.fileUrl || null;
            }
          }
        } else if (typeof data === 'object') {
          if (type === 'privacy') {
            return data.privacyPolicyUrl || data.privacy_policy_url || data.privacyUrl || data.privacy || null;
          }
          if (type === 'terms') {
            return data.termsAndConditionsUrl || data.terms_and_conditions_url || data.termsUrl || data.terms || null;
          }
        }
        return null;
      }

      function buildViewerSrc(url) {
        var raw = String(url).trim();
        if (!raw) return '';
        if (raw.indexOf('drive.google.com') !== -1) {
          return raw.replace(/\/view(\?.*)?$/, '/preview');
        }
        return raw + '#toolbar=0&navpanes=0&scrollbar=1';
      }

      function renderViewer(url, title) {
        if (!container) return;
        var viewerSrc = buildViewerSrc(url);
        if (!viewerSrc) {
          renderStatus('Document currently unavailable.', false);
          return;
        }
        container.innerHTML = '<div class="legal-document-viewer">' +
          '<div class="no-popout-blocker" aria-hidden="true"></div>' +
          '<iframe class="legal-viewer-frame" src="' + viewerSrc + '" title="' + title + '" frameborder="0" loading="lazy"></iframe>' +
          '</div>';
      }

      function loadDocument() {
        renderLoading();
        var apiUrl = 'https://filmytell.com/ott/api/legal/document-urls';

        fetch(apiUrl, { method: 'GET', cache: 'no-cache' })
          .then(function (res) {
            if (!res.ok) throw new Error('API status ' + res.status);
            return res.json();
          })
          .then(function (res) {
            var payload = (res && typeof res === 'object' && res.data !== undefined) ? res.data : res;
            var url = extractDocumentUrl(payload, docType);
            if (url && typeof url === 'string' && url.trim().length > 0) {
              renderViewer(url, 'Privacy Policy');
            } else {
              renderStatus('Document currently unavailable.', false);
            }
          })
          .catch(function () {
            renderStatus('Unable to load this document. Please try again later.', true);
          });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadDocument);
      } else {
        loadDocument();
      }
    })();
  </script>
</body>

</html>
